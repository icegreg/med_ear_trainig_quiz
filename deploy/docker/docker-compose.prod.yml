# Продовый стек TNOISE — самостоятельный, без Coolify.
# db (PostgreSQL) + web (Django/gunicorn) + nginx (TLS) + certbot (Let's Encrypt).
#
# Запуск: из корня проекта
#   docker compose -f deploy/docker/docker-compose.prod.yml --env-file .env up -d
# Удобнее через обёртки: deploy/scripts/start.sh / stop.sh (сами подставляют пути).
#
# Flutter web-бандлы (patient/doctor) должны быть собраны ЗАРАНЕЕ с FLAVOR=prod —
# см. docs/deploy/README.md. Их раздаёт nginx из ./*/build/web.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ${PROJECT_ROOT:-../..}/.env
    # Порт наружу НЕ пробрасываем — БД доступна только внутри compose-сети.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ${PROJECT_ROOT:-../..}/server
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ${PROJECT_ROOT:-../..}/.env
    environment:
      - DOCS_DIR=${DOCS_DIR-/app/docs}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - client_logs_data:/app/client_logs
      - ${PROJECT_ROOT:-../..}/docs:/app/docs:ro
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${PROJECT_ROOT:-../..}/deploy/docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PROJECT_ROOT:-../..}/patient_app/build/web:/usr/share/nginx/html/patient:ro
      - ${PROJECT_ROOT:-../..}/doctor_app/build/web:/usr/share/nginx/html/doctor:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - web
    # Периодический reload — подхватывает продлённый сертификат без простоя.
    command: >
      sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done &
             nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    # Проверка на продление каждые 12 часов (certbot сам продлевает за 30 дней).
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot;
             sleep 12h & wait $${!}; done"

volumes:
  postgres_data:
  media_data:
  static_data:
  client_logs_data:
  certbot_certs:
  certbot_webroot:
