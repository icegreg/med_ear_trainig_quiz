# nginx-сайт нативной установки TNOISE (tnoise.com).
# Установка:
#   sudo cp deploy/native/nginx-tnoise.conf /etc/nginx/sites-available/tnoise.conf
#   sudo ln -sf /etc/nginx/sites-available/tnoise.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS добавляет certbot автоматически:
#   sudo certbot --nginx -d tnoise.com -d www.tnoise.com
# (certbot впишет listen 443 ssl, пути к сертификату и редирект 80→443).
#
# Пути предполагают проект в /opt/tnoise. Flutter web собран с FLAVOR=prod.

upstream tnoise_django {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name tnoise.com www.tnoise.com;
    client_max_body_size 100M;

    # Patient Flutter web app (default)
    location / {
        root /opt/tnoise/patient_app/build/web;
        try_files $uri $uri/ /index.html;
    }

    # Doctor Flutter web app
    location = /doctors {
        return 301 /doctors/;
    }
    location /doctors/ {
        alias /opt/tnoise/doctor_app/build/web/;
        try_files $uri $uri/ /doctors/index.html;
    }

    location /api/ {
        proxy_pass http://tnoise_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://tnoise_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /opt/tnoise/server/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Публичные APK-релизы (без auth). Стабильно: /releases/latest.apk
    location /releases/ {
        alias /opt/tnoise/server/media/releases/;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /docs/ {
        proxy_pass http://tnoise_django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Protected media (аудио) — через Django (проверка auth).
    location /media/ {
        proxy_pass http://tnoise_django;
        proxy_set_header Authorization $http_authorization;
    }
}
