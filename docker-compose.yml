services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: ./server
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - client_logs_data:/app/client_logs
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./patient_app/build/web:/usr/share/nginx/html/patient:ro
      - ./doctor_app/build/web:/usr/share/nginx/html/doctor:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    depends_on:
      - web

  # ─── Flutter web build (one-shot, профиль "build") ──────────────────────
  # Собирают web-бандлы в ./*/build/web, которые раздаёт nginx (тот же mount).
  # Запуск по требованию:
  #   docker compose --profile build run --rm flutter-patient
  #   docker compose --profile build run --rm flutter-doctor
  # chown в конце возвращает артефакты владельцу-хосту (иначе build/ станет root).
  flutter-patient:
    profiles: ["build"]
    image: instrumentisto/flutter:3.24
    working_dir: /app
    volumes:
      - ./patient_app:/app
      - flutter_pub_cache:/root/.pub-cache
    command: >
      sh -c "flutter pub get &&
             flutter build web --dart-define=FLAVOR=dev &&
             chown -R ${HOST_UID:-1000}:${HOST_GID:-1000} /app"

  flutter-doctor:
    profiles: ["build"]
    image: instrumentisto/flutter:3.24
    working_dir: /app
    volumes:
      - ./doctor_app:/app
      - flutter_pub_cache:/root/.pub-cache
    command: >
      sh -c "flutter pub get &&
             flutter build web --base-href=/doctors/ --dart-define=FLAVOR=dev &&
             chown -R ${HOST_UID:-1000}:${HOST_GID:-1000} /app"

volumes:
  postgres_data:
  media_data:
  static_data:
  client_logs_data:
  flutter_pub_cache:
