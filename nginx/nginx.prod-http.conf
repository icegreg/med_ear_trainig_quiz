# Прод-конфиг nginx БЕЗ TLS — первый этап деплоя на self-hosted VPS.
# Отдаёт всё по :80 (доступ по IP/домену), без редиректа на HTTPS.
# Когда домен заведён и серты выпущены — переключиться на nginx.prod.conf
# (см. bootstrap-инструкцию в его шапке) и убрать оверрайд
# docker-compose.prod-http.yml.
#
# Используется через:
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod-http.yml up -d

upstream django {
    server web:8000;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 100M;

    # Webroot для будущего выпуска сертов Let's Encrypt (ACME challenge).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Patient Flutter web app (default)
    location / {
        root /usr/share/nginx/html/patient;
        try_files $uri $uri/ /index.html;
    }

    # Doctor Flutter web app
    location = /doctors {
        return 301 /doctors/;
    }
    location /doctors/ {
        alias /usr/share/nginx/html/doctor/;
        try_files $uri $uri/ /doctors/index.html;
    }

    # Django API
    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files — nginx раздаёт напрямую из shared volume
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Публичные APK-релизы — nginx раздаёт напрямую из media-тома (без auth).
    location /releases/ {
        alias /var/www/media/releases/;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Документация — проксируем на Django (раздача включается через DOCS_DIR).
    location /docs/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Protected media — проксируем на Django (проверка auth)
    location /media/ {
        proxy_pass http://django;
        # Без Host Django видит имя апстрима ("django") и отвергает запрос
        # как DisallowedHost (400) — /media/ проксируется так же, как /api/.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }
}
