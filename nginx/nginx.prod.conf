# Прод-конфиг nginx с TLS (Let's Encrypt). Домен: tnoise.com + www.tnoise.com.
# Используется только в docker-compose.prod.yml; локалка/dev берёт nginx.conf.
#
# ── Первый запуск ─────────────────────────────────────────────────────────
# :443-блок ссылается на серты, которых при чистом старте ещё нет, поэтому
# нельзя просто поднять этот конфиг на пустом хосте. Всю последовательность
# (поднять :80 → выпустить серты через webroot → переключиться на TLS)
# делает scripts/init-letsencrypt.sh. Подробности — deploy/HTTPS.md.
#
# ── Продление ─────────────────────────────────────────────────────────────
# Автоматическое, без cron на хосте: сайдкар `certbot` в docker-compose.prod.yml
# каждые 12 ч зовёт `certbot renew` (challenge кладётся в /var/www/certbot,
# который отдаёт :80-блок ниже), а nginx каждые 6 ч делает `nginx -s reload`
# и подхватывает обновлённые файлы.

upstream django {
    server web:8000;
}

# ── Заглушки для чужого Host (сканеры, обращения по голому IP) ─────────────
# Без них первый server-блок стал бы default_server и редиректил, например,
# http://159.195.156.249 на https://159.195.156.249 — то есть на заведомо
# невалидный для наших сертов адрес. ACME-challenge отдаём всё равно: LE
# ходит по имени, но лишняя страховка не мешает.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 444;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;
    # Рвём TLS-handshake, не предъявляя чужого сертификата (nginx >= 1.19.4).
    ssl_reject_handshake on;
}

# ── HTTP :80 — ACME-challenge + редирект на HTTPS ──────────────────────────
server {
    listen 80;
    server_name tnoise.com www.tnoise.com;

    # Let's Encrypt webroot-проверка (renew ходит сюда).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всё остальное — на HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS :443 — основной сервер ───────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name tnoise.com www.tnoise.com;
    client_max_body_size 100M;

    ssl_certificate     /etc/letsencrypt/live/tnoise.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tnoise.com/privkey.pem;

    # Современный TLS (Mozilla intermediate).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (полгода). Браузер запомнит запрет на http:// для tnoise.com —
    # откат на HTTP после этого невозможен до истечения max-age. Включаем
    # только после того, как HTTPS проверен (см. чек-лист в deploy/HTTPS.md).
    add_header Strict-Transport-Security "max-age=15768000" always;

    # OCSP stapling выключен намеренно: Let's Encrypt свернул OCSP-респондеры
    # и в свежих сертах нет OCSP URL — nginx на каждом старте писал бы
    # `"ssl_stapling" ignored, no OCSP responder URL`, а пользы ноль.
    # Отзыв сертов у LE теперь публикуется через CRL, на стороне nginx
    # включать нечего.

    # Patient Flutter web app (default)
    location / {
        root /usr/share/nginx/html/patient;
        try_files $uri $uri/ /index.html;
    }

    # Doctor Flutter web app
    location = /doctors {
        return 301 /doctors/;
    }
    location /doctors/ {
        alias /usr/share/nginx/html/doctor/;
        try_files $uri $uri/ /doctors/index.html;
    }

    # Django API
    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files — nginx раздаёт напрямую из shared volume
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Публичные APK-релизы — nginx раздаёт напрямую из media-тома (без auth).
    location /releases/ {
        alias /var/www/media/releases/;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Документация — проксируем на Django (раздача включается через DOCS_DIR).
    location /docs/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Protected media — проксируем на Django (проверка auth)
    location /media/ {
        proxy_pass http://django;
        # Без Host Django видит имя апстрима ("django") и отвергает запрос
        # как DisallowedHost (400) — /media/ проксируется так же, как /api/.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }
}
