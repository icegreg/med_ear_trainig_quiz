name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Отменяем предыдущие запуски того же PR/ветки.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: med_ear_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test
      POSTGRES_DB: med_ear_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ci-only-secret-not-for-prod

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Admin-тесты рендерят шаблоны с {% static %}, а STORAGES использует
      # CompressedManifestStaticFilesStorage — нужен манифест (как в Docker-сборке).
      - name: Collect static
        working-directory: server
        run: python manage.py collectstatic --noinput

      - name: Run Django tests (PostgreSQL)
        working-directory: server
        run: python manage.py test core.tests --verbosity 2

  flutter-analyze:
    name: flutter-analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: Doctor app — analyze
        working-directory: doctor_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Patient app — analyze
        working-directory: patient_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
